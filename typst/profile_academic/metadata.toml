# Profile: academic. Postdoctoral / research-forward CV.
#
# This file holds the configuration shared by cv.typ and letter.typ:
# personal info, header tagline, footer text, and the ordered list of
# CV sections to render. Section content lives in the sibling .typ files
# (professional.typ, education.typ, …); each one is included by cv.typ
# in the order set by `modules` below.
#
# Compile:
#     typst compile cv.typ     --input profile=academic
#     typst compile letter.typ --input profile=academic
#
# To create a new profile, copy this directory to profile_<name>/ and
# edit the fields below.

# Italic tagline shown directly under the name in the header.
header_quote = "PhD Candidate, Neurosciences"

# Short label shown in the page footer.
cv_footer     = "Curriculum Vitae"
letter_footer = "Cover Letter"

# Last-updated stamp (shown in the footer next to the doc label).
updated = "May 2026"

# Section render order. Each entry maps to a sibling file:
# `professional` → professional.typ, etc. Re-order, add, or remove to
# change which sections appear.
modules = ["profile", "professional", "education", "skills", "teaching", "software", "honours", "courses", "publications"]

[layout]
    # Page size. Possible values: "a4", "us-letter".
    paper_size = "us-letter"

[personal]
    first_name = "Sofía"
    last_name  = "Fernández Lozano"
    # address  = "Street\nCity, ZIP"  # Optional, for cover-letter sender block.

    # Contact line: rendered in the order keys appear here. Re-order the
    # lines below to re-order the icons in the header.
    [personal.info]
        email    = "sofia.fernandezlozano@mail.mcgill.ca"
        phone    = "+1 (438) 506-2094"
        orcid    = "0000-0003-2288-8111"
        github   = "soffiafdz"
